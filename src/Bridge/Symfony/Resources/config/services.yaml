services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Adapters
    Timbrs\DatabaseDumps\Contract\DatabaseConnectionInterface:
        class: Timbrs\DatabaseDumps\Adapter\DoctrineDbalAdapter
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    Timbrs\DatabaseDumps\Contract\FileSystemInterface:
        class: Timbrs\DatabaseDumps\Util\FileSystemHelper

    Timbrs\DatabaseDumps\Contract\ConfigLoaderInterface:
        class: Timbrs\DatabaseDumps\Util\YamlConfigLoader

    # Logger — NullLogger по умолчанию, command override (см. ниже)
    Timbrs\DatabaseDumps\Contract\LoggerInterface:
        class: Timbrs\DatabaseDumps\Bridge\Symfony\ConsoleLogger

    # Platform (для обратной совместимости)
    Timbrs\DatabaseDumps\Contract\DatabasePlatformInterface:
        factory: ['Timbrs\DatabaseDumps\Platform\PlatformFactory', 'create']
        arguments:
            $platformName: '%database_dumps.platform%'

    # Config
    # Окружение берём у ядра, а не из getenv('APP_ENV'): kernel.environment учитывает
    # --env и .env, и совпадает с тем, по чему DI-расширение считает data_dir.
    # Иначе prod-гейтинг в рантайме и путь к конфигу в контейнере разъезжаются.
    Timbrs\DatabaseDumps\Config\EnvironmentConfig:
        arguments:
            $currentEnv: '%kernel.environment%'

    # Файл настроек бандла: config/packages/database_dumps.yaml (запись из configure-llm).
    Timbrs\DatabaseDumps\Contract\SettingsFileInterface:
        class: Timbrs\DatabaseDumps\Config\SettingsFile\YamlBundleSettingsFile

    # Единое хранилище настроек. ЧИТАЕТ из контейнера ($settings), а не из файла:
    # так работают дефолты Configuration и оверрайды config/packages/{env}/.
    Timbrs\DatabaseDumps\Service\Ai\DbdumpConfigStore:
        arguments:
            $settingsFile: '@Timbrs\DatabaseDumps\Contract\SettingsFileInterface'
            $settings: '%database_dumps.settings%'

    # Запись токена в .env.local/.env
    Timbrs\DatabaseDumps\Util\EnvFileWriter: ~

    Timbrs\DatabaseDumps\Config\AiConfig:
        factory: ['@Timbrs\DatabaseDumps\Service\Ai\DbdumpConfigStore', 'resolve']
        arguments:
            $projectDir: '%kernel.project_dir%'

    Timbrs\DatabaseDumps\Contract\HttpTransportInterface:
        class: Timbrs\DatabaseDumps\Service\Ai\CurlHttpTransport

    Timbrs\DatabaseDumps\Contract\AiClientInterface:
        factory: ['Timbrs\DatabaseDumps\Service\Ai\AiClientFactory', 'create']
        arguments:
            $transport: '@Timbrs\DatabaseDumps\Contract\HttpTransportInterface'
            $config: '@Timbrs\DatabaseDumps\Config\AiConfig'
            $logger: '@Timbrs\DatabaseDumps\Contract\LoggerInterface'

    Timbrs\DatabaseDumps\Service\Faker\LlmPatternDetector: ~

    Timbrs\DatabaseDumps\Util\ConditionalConfigLoader:
        arguments:
            $loader: '@Timbrs\DatabaseDumps\Contract\ConfigLoaderInterface'

    Timbrs\DatabaseDumps\Config\DumpConfig:
        factory: ['@Timbrs\DatabaseDumps\Util\ConditionalConfigLoader', 'load']
        arguments:
            $path: '%database_dumps.config_path%'

    # Бережный доступ к БД: таймауты сессии по профилю (analyze/export/import), бюджет
    # запросов разведки, порог сканирования. Один разделяемый экземпляр: профиль переключают
    # дампер и импортёр, реестр подключений применяет SET при первом getConnection().
    Timbrs\DatabaseDumps\Service\Db\SafeQueryPolicy:
        arguments:
            $settings: '%database_dumps.db%'

    # Статистика планировщика PostgreSQL вместо COUNT(*)/DISTINCT по данным.
    Timbrs\DatabaseDumps\Service\Db\PgStatsReader: ~

    # Оценка строк, точный подсчёт только на небольших таблицах.
    Timbrs\DatabaseDumps\Service\Db\RowCounter: ~

    # ConnectionRegistry
    Timbrs\DatabaseDumps\Contract\ConnectionRegistryInterface:
        class: Timbrs\DatabaseDumps\Service\ConnectionRegistry
        factory: ['Timbrs\DatabaseDumps\Bridge\Symfony\ConnectionRegistryFactory', 'create']
        arguments:
            $defaultConnection: '@doctrine.dbal.default_connection'
            $dumpConfig: '@Timbrs\DatabaseDumps\Config\DumpConfig'
            $container: '@service_container'
            $policy: '@Timbrs\DatabaseDumps\Service\Db\SafeQueryPolicy'
            $logger: '@Timbrs\DatabaseDumps\Contract\LoggerInterface'

    # Services — явно перечисляем, чтобы избежать неоднозначных биндингов
    Timbrs\DatabaseDumps\Service\Parser\StatementSplitter: ~
    Timbrs\DatabaseDumps\Service\Parser\SqlParser: ~
    Timbrs\DatabaseDumps\Service\Importer\TransactionManager: ~
    Timbrs\DatabaseDumps\Service\Importer\ScriptExecutor: ~
    Timbrs\DatabaseDumps\Service\Importer\SchemaValidator: ~
    Timbrs\DatabaseDumps\Service\Security\ProductionGuard: ~
    Timbrs\DatabaseDumps\Service\Dumper\TableConfigResolver: ~
    Timbrs\DatabaseDumps\Service\Graph\TopologicalSorter: ~
    Timbrs\DatabaseDumps\Service\Graph\TableDependencyResolver: ~
    Timbrs\DatabaseDumps\Service\ConfigGenerator\ForeignKeyInspector: ~
    Timbrs\DatabaseDumps\Service\ConfigGenerator\PrimaryKeyInspector: ~
    Timbrs\DatabaseDumps\Service\ConfigGenerator\TableInspector: ~
    # Служебные таблицы фреймворков: список настраивается (settings.service_tables),
    # потому что доменное имя может совпасть со служебным.
    Timbrs\DatabaseDumps\Service\ConfigGenerator\ServiceTableFilter:
        arguments:
            $settings: '%database_dumps.service_tables%'
    Timbrs\DatabaseDumps\Service\ConfigGenerator\ConfigSplitter: ~
    Timbrs\DatabaseDumps\Service\ConfigGenerator\ModeParser: ~
    Timbrs\DatabaseDumps\Service\ConfigGenerator\RegenerationGuard: ~
    Timbrs\DatabaseDumps\Service\Generator\TruncateGenerator: ~
    Timbrs\DatabaseDumps\Service\Generator\SequenceGenerator: ~
    Timbrs\DatabaseDumps\Service\Generator\DeferredUpdateGenerator: ~
    Timbrs\DatabaseDumps\Service\Generator\SqlGenerator: ~

    # Faker
    Timbrs\DatabaseDumps\Service\Faker\RussianFaker: ~

    # Alias: ОДИН инстанс RussianFaker используется через интерфейс
    Timbrs\DatabaseDumps\Contract\FakerInterface: '@Timbrs\DatabaseDumps\Service\Faker\RussianFaker'

    Timbrs\DatabaseDumps\Service\ConfigGenerator\ConfigGenerator:
        arguments:
            $cascadeEnabled: true
            $fakerEnabled: true
            $splitBySchema: true
            $projectDir: '%kernel.project_dir%'

    Timbrs\DatabaseDumps\Service\Generator\InsertGenerator:
        arguments:
            $batchSize: '%database_dumps.batch_size%'

    Timbrs\DatabaseDumps\Service\Faker\PatternDetector:
        arguments:
            $sampleSize: '%database_dumps.sample_size%'

    # Профилирование и авто-критерии (deep-анализ)
    Timbrs\DatabaseDumps\Service\ConfigGenerator\ColumnStatisticsInspector:
        arguments:
            $sampleSize: '%database_dumps.sample_size%'
    Timbrs\DatabaseDumps\Service\ConfigGenerator\CriteriaSuggester: ~
    Timbrs\DatabaseDumps\Service\Analysis\AnalysisReportWriter: ~

    # Анализ кода через OPENCODE
    # Grep-сканер использований таблиц в коде хоста (стартовые точки для OPENCODE).
    # Скаляр $projectDir не автовайрится — задаём явно; logger автовайрится.
    Timbrs\DatabaseDumps\Service\Analysis\CodeHintScanner:
        arguments:
            $projectDir: '%kernel.project_dir%'
    Timbrs\DatabaseDumps\Service\Analysis\AnalysisPackageBuilder:
        arguments:
            $projectDir: '%kernel.project_dir%'
    Timbrs\DatabaseDumps\Service\Analysis\AnalysisIngestor: ~
    Timbrs\DatabaseDumps\Service\Analysis\DecisionApplier: ~
    Timbrs\DatabaseDumps\Service\Analysis\CriteriaSqlTester: ~
    Timbrs\DatabaseDumps\Service\Analysis\ConfigEnricher:
        arguments:
            $projectDir: '%kernel.project_dir%'
    Timbrs\DatabaseDumps\Service\Analysis\ConfigCriteriaRepairer:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Аудит конфига без БД (validate)
    Timbrs\DatabaseDumps\Service\Validation\ConfigAuditor: ~
    Timbrs\DatabaseDumps\Service\Validation\AuditFixer: ~
    Timbrs\DatabaseDumps\Service\Validation\JsonReportWriter: ~

    # Sample-выборка по именованным критериям
    Timbrs\DatabaseDumps\Service\Dumper\SelectedPkRegistry: ~

    # Ход выборки по критериям (корзины, строки, усечения) — один на прогон экспорта,
    # сбрасывается в analysis/sample-report.json.
    Timbrs\DatabaseDumps\Service\Dumper\SampleReportCollector: ~
    Timbrs\DatabaseDumps\Service\Dumper\SampleQueryBuilder: ~

    Timbrs\DatabaseDumps\Service\Dumper\CascadeWhereResolver:
        arguments:
            $maxDepth: '%database_dumps.max_cascade_depth%'

    Timbrs\DatabaseDumps\Service\Dumper\DataFetcher: ~

    Timbrs\DatabaseDumps\Service\Dumper\DatabaseDumper:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Timbrs\DatabaseDumps\Service\Importer\DatabaseImporter:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Verification — проверка того, что уже выгружено. К БД не подключается, читает dumps/
    # (каждый файл один раз на все проверки — DumpVerificationRunner).
    Timbrs\DatabaseDumps\Service\Verification\DumpValueReader: ~

    Timbrs\DatabaseDumps\Service\Verification\CascadeClosureVerifier: ~

    Timbrs\DatabaseDumps\Service\Verification\ValueCoverageVerifier: ~

    Timbrs\DatabaseDumps\Service\Verification\PiiLeakVerifier: ~

    Timbrs\DatabaseDumps\Service\Verification\RowCountVerifier: ~

    Timbrs\DatabaseDumps\Service\Verification\DumpVerificationRunner:
        arguments:
            $verifiers:
                - '@Timbrs\DatabaseDumps\Service\Verification\CascadeClosureVerifier'
                - '@Timbrs\DatabaseDumps\Service\Verification\ValueCoverageVerifier'
                - '@Timbrs\DatabaseDumps\Service\Verification\PiiLeakVerifier'
                - '@Timbrs\DatabaseDumps\Service\Verification\RowCountVerifier'

    # Commands — ЛЕНИВАЯ регистрация: имя команды указано в теге, поэтому Symfony знает его
    # БЕЗ создания объекта команды (и без инстанцирования графа зависимостей, включая DumpConfig).
    # Тогда `list` показывает все команды, а инстанцирование (и падение на битом конфиге) —
    # только при запуске КОНКРЕТНОЙ команды, с реальной ошибкой, а не «command is not defined».
    # Резолвер ресурса регистрирует сами сервисы (autowire); теги задаём явно ниже.
    Timbrs\DatabaseDumps\Bridge\Symfony\Command\:
        resource: '../../Command/*'

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\DumpExportCommand:
        tags:
            - { name: 'console.command', command: 'app:dbdump:export' }

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\DbInitCommand:
        tags:
            - { name: 'console.command', command: 'app:dbdump:import' }

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\PrepareConfigCommand:
        arguments:
            $configPath: '%database_dumps.config_path%'
            $projectDir: '%kernel.project_dir%'
        tags:
            - { name: 'console.command', command: 'app:dbdump:prepare-config' }

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\ConfigureLlmCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags:
            - { name: 'console.command', command: 'app:dbdump:configure-llm' }

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\PrepareAnalysisCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags:
            - { name: 'console.command', command: 'app:dbdump:prepare-analysis' }

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\ApplyAnalysisCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $configPath: '%database_dumps.config_path%'
        tags:
            # Оба имени регистрируем явно: у ленивой команды Symfony берёт имя из тега,
            # объект не создаётся, и getAliases() ему взять неоткуда.
            - { name: 'console.command', command: 'app:dbdump:apply-analysis' }
            - { name: 'console.command', command: 'app:dbdump:apply' }

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\RepairConfigsCommand:
        arguments:
            $configPath: '%database_dumps.config_path%'
        tags:
            # Оба имени регистрируем явно: у ленивой команды Symfony берёт имя из тега,
            # объект не создаётся, и getAliases() ему взять неоткуда.
            - { name: 'console.command', command: 'app:dbdump:check-criteria' }
            - { name: 'console.command', command: 'app:dbdump:repair-configs' }

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\ValidateConfigCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $configPath: '%database_dumps.config_path%'
        tags:
            - { name: 'console.command', command: 'app:dbdump:validate' }

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\VerifyDumpCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $dataDir: '%database_dumps.data_dir%'
        tags:
            - { name: 'console.command', command: 'app:dbdump:verify-dump' }

    # Досье по таблице и колонке: слепок + код + конфиг + миграции + вьюхи в одном файле на схему.
    Timbrs\DatabaseDumps\Service\Analysis\Dossier\MigrationScanner:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Timbrs\DatabaseDumps\Service\Analysis\Dossier\ViewScanner: ~

    Timbrs\DatabaseDumps\Service\Analysis\Dossier\DossierBuilder: ~

    # Решения по досье (R1…R11) и переходник со старого вывода агента.
    Timbrs\DatabaseDumps\Service\Analysis\Decision\DecisionEngine: ~

    Timbrs\DatabaseDumps\Service\Analysis\LegacyOutputAdapter: ~

    # Единая проверка: стадии static/live/plan/dump/import, один JSON, реестр кодов FindingCatalog.
    Timbrs\DatabaseDumps\Service\Check\CheckRunner:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\CheckCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $configPath: '%database_dumps.config_path%'
        tags:
            - { name: 'console.command', command: 'app:dbdump:check' }

    # Инкремент: отметка проверенного состояния и грязный набор.
    Timbrs\DatabaseDumps\Bridge\Symfony\Command\CheckpointCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $configPath: '%database_dumps.config_path%'
        tags:
            - { name: 'console.command', command: 'app:dbdump:checkpoint' }

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\DocsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags:
            - { name: 'console.command', command: 'app:dbdump:docs' }

    Timbrs\DatabaseDumps\Bridge\Symfony\Command\WorkflowCommand:
        tags:
            - { name: 'console.command', command: 'app:dbdump' }
